server {
    listen 443 ssl;
    server_name li-api.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/li-api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/li-api.yourdomain.com/privkey.pem;

    # Proxy to the local uvicorn instance. The API itself enforces API_KEY, so
    # do not add auth here — just terminate TLS and forward.
    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
